name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install NSIS (Windows installer)
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Read version from mygo.json
        id: ver
        run: |
          VERSION=$(jq -r .version mygo.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build all targets with mygo
        run: |
          go run github.com/egoist/mygo/cmd/mygo build \
            -platform linux/amd64,linux/arm64,windows/amd64,windows/arm64 \
            -skip-build-command

      - name: List artifacts
        run: find build -type f | sort

      - name: Create draft release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: IPAtlas ${{ steps.ver.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            build/linux-*/*.deb
            build/linux-*/*-linux-*.tar.gz
            build/windows-*/*-setup-*.exe